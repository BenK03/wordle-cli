[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wordle-cli"
version = "0.1.1"
description = "Terminal-based Wordle clone packaged as a Python CLI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
wordle = "wordle.main:main"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/wordle"]

[tool.hatch.build.targets.wheel.force-include]
"src/wordle/data/words.txt" = "wordle/data/words.txt"

[tool.hatch.build.targets.sdist]
packages = ["src/wordle"]

[tool.hatch.build.targets.sdist.force-include]
"src/wordle/data/words.txt" = "wordle/data/words.txt"